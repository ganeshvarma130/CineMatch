<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineMatch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --card: #16161f;
    --card-hover: #1e1e2e;
    --border: rgba(120,100,255,0.15);
    --border-hover: rgba(120,100,255,0.4);
    --purple: #7c4dff;
    --purple-light: #9c6fff;
    --pink: #e040fb;
    --cyan: #00e5ff;
    --gold: #ffd740;
    --green: #69f0ae;
    --red: #ff5252;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --text-muted: #555570;
    --gradient: linear-gradient(135deg, #7c4dff, #e040fb);
    --gradient2: linear-gradient(135deg, #00e5ff, #7c4dff);
    --glow: 0 0 20px rgba(124,77,255,0.3);
    --glow-pink: 0 0 20px rgba(224,64,251,0.3);
    --radius: 16px;
    --radius-sm: 10px;
    --nav-w: 240px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Outfit', sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }

  /* LAYOUT */
  .app { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: var(--nav-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform 0.3s ease;
  }
  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-text {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .logo-sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .nav-links { flex: 1; padding: 16px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.92rem;
    font-weight: 500;
    border-left: 3px solid transparent;
    transition: all 0.2s ease;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: rgba(124,77,255,0.07); }
  .nav-item.active { color: var(--purple-light); border-left-color: var(--purple); background: rgba(124,77,255,0.1); }
  .nav-icon { font-size: 1.2rem; width: 24px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    background: var(--gradient);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .sidebar-bottom {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* MAIN CONTENT */
  .main { margin-left: var(--nav-w); flex: 1; min-height: 100vh; min-width: 0; }

  /* TOPBAR */
  .topbar {
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--text); }
  .search-wrap { flex: 1; max-width: 500px; position: relative; }
  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 20px 10px 44px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus { border-color: var(--purple); box-shadow: var(--glow); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; pointer-events: none; }
  .search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
  .topbar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .avatar {
    width: 36px; height: 36px;
    background: var(--gradient);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 700; color: white;
    cursor: pointer;
  }

  /* PAGE */
  .page { padding: 32px; }

 /* HERO */

.hero {
    background: linear-gradient(
        135deg,
        rgba(124,77,255,0.15) 0%,
        rgba(224,64,251,0.1) 50%,
        rgba(0,229,255,0.05) 100%
    );
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
}
  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(124,77,255,0.2) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(224,64,251,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--purple-light); margin-bottom: 12px; }
  .hero-title { font-family: var(--font-display); font-size: 2.8rem; font-weight: 700; line-height: 1.15; margin-bottom: 16px; }
  .hero-title span { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero-sub { color: var(--text-dim); font-size: 1rem; max-width: 480px; line-height: 1.6; margin-bottom: 28px; }
  .hero-search { display: flex; gap: 12px; max-width: 520px; }
  .hero-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 14px 24px;
    color: var(--text);
    font-family: var(--font-body); font-size: 1rem;
    outline: none; transition: all 0.2s;
  }
  .hero-input:focus { border-color: var(--purple); box-shadow: var(--glow); }
  .hero-input::placeholder { color: var(--text-muted); }
  .btn {
    padding: 14px 28px;
    background: var(--gradient);
    color: white; border: none;
    border-radius: 50px;
    font-family: var(--font-body); font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
  .btn:active { transform: translateY(0); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--purple);
    color: var(--purple-light);
  }
  .btn-outline:hover { background: rgba(124,77,255,0.1); }
  .btn-sm { padding: 8px 18px; font-size: 0.82rem; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); box-shadow: none; }

  /* MOBILE HERO */

.hero {
  padding: 28px 20px;
  border-radius: 18px;
  margin-bottom: 28px;
}

.hero-eyebrow {
  font-size: 0.65rem;
  letter-spacing: 2px;
}

.hero-title {
  font-size: 2rem;
  line-height: 1.2;
  margin-bottom: 12px;
}

.hero-sub {
  font-size: 0.9rem;
  line-height: 1.5;
  margin-bottom: 20px;
}

.hero-search {
  flex-direction: column;
  gap: 10px;
  max-width: 100%;
}

.hero-input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 18px;
  font-size: 0.9rem;
}

.hero-search .btn {
  width: 100%;
  padding: 13px 20px;
}

  /* STATS ROW */
  .stats-row { display: flex; gap: 20px; margin-bottom: 40px; }
  .stat-card {
    flex: 1; background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    transition: all 0.2s;
  }
  .stat-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
  .stat-icon { font-size: 1.5rem; margin-bottom: 10px; }
  .stat-num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  /* SECTION */
  .section { margin-bottom: 40px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .section-title-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gradient); }
  .see-all { color: var(--purple-light); font-size: 0.85rem; cursor: pointer; text-decoration: none; font-weight: 500; }
  .see-all:hover { color: var(--pink); }

  /* GENRE CHIPS */
  .genre-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip {
    padding: 7px 16px;
    border-radius: 50px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.82rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    background: transparent;
  }
  .chip:hover { border-color: var(--purple); color: var(--purple-light); }
  .chip.active { background: var(--gradient); border-color: transparent; color: white; }

  /* MOVIE GRID */
  .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .movie-grid.large { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

 
.movie-card {
  min-width: 0;
}
  /* MOVIE CARD */
  .movie-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .movie-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), var(--glow);
  }
   .movie-poster {
    position: relative;
    height: 230px;
    overflow: hidden;
    border-radius: 10px;
   }
    .poster-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.movie-row-wrapper {
    position: relative;
    width: 100%;
    overflow: visible;
}

.scroll-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(20, 20, 30, 0.9);
    color: white;
    font-size: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.scroll-btn.left {
    left: 15px;
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
}

.scroll-btn.right {
    right: 15px;
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
}

.scroll-btn:hover {
    background: #7c4dff;
}


  .movie-poster::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
  .poster-type-badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px;
    font-size: 0.65rem; font-weight: 600; color: var(--text);
    text-transform: uppercase; letter-spacing: 1px; z-index: 2;
  }
  .fav-btn {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.9rem; z-index: 2;
    transition: all 0.2s;
  }
  .fav-btn:hover, .fav-btn.active { background: rgba(224,64,251,0.3); border-color: var(--pink); transform: scale(1.15); }
  .movie-info { padding: 14px; }
  .movie-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; line-height: 1.3; color: var(--text); }
  .movie-meta { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--text-muted); flex-wrap: wrap; }
  .movie-rating { color: var(--gold); font-weight: 600; font-size: 0.8rem; }
  .movie-genres { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .genre-tag {
    padding: 3px 9px; border-radius: 20px;
    background: rgba(124,77,255,0.12);
    border: 1px solid rgba(124,77,255,0.2);
    font-size: 0.68rem; color: var(--purple-light); font-weight: 500;
  }

  /* SEARCH RESULTS */
  .search-results {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .search-results-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .search-results-title { font-family: var(--font-display); font-weight: 600; }
  .results-count {
    padding: 4px 12px; border-radius: 20px;
    background: rgba(124,77,255,0.15);
    color: var(--purple-light); font-size: 0.78rem; font-weight: 600;
  }

  /* RECOMMENDATIONS PANEL */
  .reco-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-top: 32px;
  }
  .reco-panel-header { 
    display: flex;
     align-items: center; 
     gap: 10px;
      margin-bottom: 20px; 
    }
  .reco-ai-badge {
    padding: 4px 12px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(124,77,255,0.2), rgba(224,64,251,0.2));
    border: 1px solid rgba(124,77,255,0.3);
    font-size: 0.7rem; font-weight: 600; color: var(--purple-light); letter-spacing: 1px;
    text-transform: uppercase;
  }
  .reco-loading { display: flex; align-items: center; gap: 12px; color: var(--text-dim); font-size: 0.9rem; }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ai-response {
    background: rgba(124,77,255,0.06);
    border: 1px solid rgba(124,77,255,0.15);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text-dim);
  }

  /* HORIZONTAL SCROLL */
  .h-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; min-width: 0; }
  .h-scroll::-webkit-scrollbar { height: 3px; }
  .h-scroll .movie-card { min-width: 180px; flex-shrink: 0; }

  /* FAVORITES PAGE */
  .empty-state {
    text-align: center; padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-state h3 { font-family: var(--font-display); font-size: 1.3rem; color: var(--text-dim); margin-bottom: 8px; }
  .empty-state p { font-size: 0.9rem; max-width: 300px; margin: 0 auto 24px; line-height: 1.6; }

  /* PROFILE PAGE */
  .profile-hero {
    background: linear-gradient(135deg, rgba(124,77,255,0.12), rgba(224,64,251,0.08));
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    display: flex; align-items: center; gap: 32px;
    margin-bottom: 32px;
  }
  .profile-avatar-big {
    width: 100px; height: 100px;
    background: var(--gradient);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; font-weight: 700; color: white;
    flex-shrink: 0;
    box-shadow: var(--glow);
  }
  .profile-name { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .profile-joined { color: var(--text-muted); font-size: 0.85rem; }
  .profile-stats { display: flex; gap: 24px; margin-top: 16px; }
  .profile-stat { text-align: center; }
  .profile-stat-num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--purple-light); }
  .profile-stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
  }
  .form-card-title { font-family: var(--font-display); font-size: 1rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 0.8rem; font-weight: 500; color: var(--text-dim); letter-spacing: 0.5px; }
  .form-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    color: var(--text);
    font-family: var(--font-body); font-size: 0.9rem;
    outline: none; transition: all 0.2s;
  }
  .form-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,77,255,0.1); }
  .form-input::placeholder { color: var(--text-muted); }
  .save-toast {
    position: fixed; bottom: 32px; right: 32px;
    background: var(--green);
    color: #0a0a0f;
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: 600; font-size: 0.85rem;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 30px rgba(105,240,174,0.3);
    animation: slideUp 0.3s ease;
    z-index: 999;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

 /* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 16px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;

  padding: 18px;
  width: 100%;
  max-width: 480px;

  /* IMPORTANT */
  max-height: calc(100vh - 24px);
  overflow-y: auto;

  position: relative;
  animation: slideInModal 0.3s ease;
}

@keyframes slideInModal {
  from {
    transform: translateY(20px) scale(0.97);
    opacity: 0;
  }

  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.modal::-webkit-scrollbar {
  width: 4px;
}

.modal::-webkit-scrollbar-thumb {
  background: var(--purple);
  border-radius: 4px;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;

  width: 32px;
  height: 32px;

  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text-dim);

  transition: all 0.2s;
}

.modal-close:hover {
  background: rgba(255,82,82,0.15);
  border-color: var(--red);
  color: var(--red);
}

.modal-poster {
  width: 130px;
  height: 185px;

  margin: 0 auto 10px;

  overflow: hidden;
  border-radius: 10px;
}

.modal-poster-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;

  text-align: center;
  margin-bottom: 6px;
}

.modal-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  color: var(--text-muted);
  font-size: 0.82rem;

  margin-bottom: 10px;
}

.modal-desc {

const GENRES=["All","Action","Sci-Fi","Drama","Thriller","Horror","Romance","Comedy","Crime","Animation","Fantasy","Historical","Family"];
let page="home";
let favorites=JSON.parse(localStorage.getItem("cinematchFavorites")||"[]");
let profile=JSON.parse(localStorage.getItem("cinematchProfile")||'{"name":"","email":"","phone":""}');
let currentGenre="All",currentSort="rating",currentSearch="";

function initials(name){return name?name.split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2):"?";}
function fav(m){return favorites.some(x=>x.id===m.id);}
function toggleFav(m){
  favorites=fav(m)?favorites.filter(x=>x.id!==m.id):[...favorites,m];
  localStorage.setItem("cinematchFavorites",JSON.stringify(favorites)); render();
}
function similar(movie,count=8){
  return MOVIE_DB.filter(m=>m.id!==movie.id).map(m=>({...m,score:m.genre.filter(g=>movie.genre.includes(g)).length*2+(m.type===movie.type?1:0)+(Math.abs(m.year-movie.year)<5?.5:0)}))
  .sort((a,b)=>b.score-a.score||b.rating-a.rating).slice(0,count);
}
function card(m){
return `<div class="movie-card" data-open="${m.id}">
<div class="movie-poster">
<img src="${m.poster}" alt="${m.title}" class="poster-image">
<div class="poster-type-badge">${m.type==="anime"?"Anime":"Movie"}</div>
<button class="fav-btn ${fav(m)?"active":""}" data-fav="${m.id}">${fav(m)?"❤️":"🤍"}</button></div>
<div class="movie-info">
<div class="movie-title">${m.title}</div>
<div class="movie-meta">
<span class="movie-rating">★ ${m.rating}</span><span>·</span>
<span>${m.year}</span></div>
<div class="movie-genres">${m.genre.slice(0,2).map(g=>`<span class="genre-tag">${g}</span>`).join("")}</div></div></div>`;
}
function rows(a){return a.map(card).join("");}
function home(){
let featured=MOVIE_DB.filter(m=>m.rating>=8.5).slice(0,8), trending=[...MOVIE_DB].sort(()=>Math.random()-.5).slice(0,8);
return `<div class="page">
  <div class="hero">
    <div class="hero-eyebrow"></div>
<h1 class="hero-title">Find your next<br>
  <span>obsession</span></h1><p class="hero-sub">Search for a movie or anime and we'll find everything you'll love.</p>
<div class="hero-search">
  <input id="heroSearch" class="hero-input" placeholder="Search a movie or genre...">
  <button class="btn" id="heroBtn">Search</button></div></div>
<div class="stats-row">
  <div class="stat-card"><div class="stat-icon">🎬</div>
  <div class="stat-num">${MOVIE_DB.filter(m=>m.type==="movie").length}</div>
  <div class="stat-label">Movies</div></div>
<div class="stat-card"><div class="stat-icon">⛩️</div>
<div class="stat-num">${MOVIE_DB.filter(m=>m.type==="anime").length}</div>
<div class="stat-label">Anime</div></div>
<div class="stat-card"><div class="stat-icon">❤️</div>
<div class="stat-num">${favorites.length}</div>
<div class="stat-label">Your Favorites</div></div>
<div class="stat-card"><div class="stat-icon">✨</div>
<div class="stat-num">${GENRES.length-1}</div><div class="stat-label">Genres</div></div></div>
<div id="searchPanel"></div>
<div class="section">
    <div class="section-header">
        <div class="section-title">
            <div class="section-title-dot"></div>Top Rated
        </div>
    </div>

    <div class="movie-row-wrapper">
        <button class="scroll-btn left" onclick="scrollRow(this, -1)">‹</button>

        <div class="h-scroll">
            ${rows(featured)}
        </div>

        <button class="scroll-btn right" onclick="scrollRow(this, 1)">›</button>
    </div>
</div>
<div class="section"><div class="section-header">
  <div class="section-title"><div class="section-title-dot"></div>Discover</div></div>
  <div class="h-scroll">${rows(trending)}</div></div></div>`;
}
function listing(type){
return `<div class="page"><div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap">
<h2 style="font-family:var(--font-display);font-size:1.5rem;font-weight:700">${type==="movie"?"🎬 Movies":"⚡ Anime"}</h2>
<span id="countBadge" style="background:rgba(124,77,255,.15);color:var(--purple-light);padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600"></span>
<div style="margin-left:auto">
  <select id="sortSelect" style="background:var(--bg3);border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:8px">
    <option value="rating">Top Rated</option>
    <option value="year">Newest</option></select></div></div>
<div style="position:relative;margin-bottom:20px">
  <span class="search-icon">🔍</span>
  <input id="pageSearch" class="search-input" placeholder="Search ${type==="movie"?"movies":"anime"}..." style="width:100%;max-width:400px"></div>
<div class="genre-chips" id="genreChips"></div><div class="movie-grid large" id="movieGrid"></div></div>`;
}
function favoritesPage(){
return `<div class="page"><div style="display:flex;align-items:center;gap:12px;margin-bottom:28px"><h2 style="font-family:var(--font-display);font-size:1.5rem;font-weight:700">❤️ Favorites</h2>
<span style="background:rgba(224,64,251,.15);color:var(--pink);padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600">${favorites.length} saved</span></div>
${favorites.length?`<div class="movie-grid large">${rows(favorites)}</div>`:`<div class="empty-state">
  <div class="icon">🤍</div><h3>No favorites yet</h3>
  <p>Tap the heart on any movie or anime to save it here for later.</p></div>`}</div>`;
}
function profilePage(){
return `<div class="page">
<div class="profile-hero">
<div class="profile-avatar-big">${initials(profile.name)}</div><div>
<div class="profile-name">${profile.name||"Your Name"}</div>
<div class="profile-joined">Member since August 2026</div>
<div class="profile-stats"><div class="profile-stat">
<div class="profile-stat-num">${favorites.length}</div>
<div class="profile-stat-label">Saved</div></div>
<div class="profile-stat"><div class="profile-stat-num">${MOVIE_DB.length}</div>
<div class="profile-stat-label">Available</div>
</div><div class="profile-stat">
<div class="profile-stat-num">${GENRES.length-1}</div>
<div class="profile-stat-label">Genres</div>
</div></div></div></div>
<div class="form-card">
<div class="form-card-title">👤 Personal Information</div>
<div class="form-grid">
<div class="form-group">
<label class="form-label">Full Name</label>
<input id="nameInput" class="form-input" placeholder="Enter your name" value="${profile.name}"></div>
<div class="form-group">
<label class="form-label">Phone Number</label>
<input id="phoneInput" class="form-input" placeholder="+91 XXXXX XXXXX" value="${profile.phone}"></div>
<div class="form-group full"><label class="form-label">Email Address</label>
<input id="emailInput" class="form-input" type="email" placeholder="you@example.com" value="${profile.email}"></div></div>
<div style="margin-top:20px;display:flex;gap:12px">
<button class="btn btn-sm" id="saveProfile">Save Changes</button>
<button class="btn btn-sm btn-ghost" id="discardProfile">Discard</button></div></div>
<div class="form-card">
<div class="form-card-title">🎬 Your Taste</div>
<div style="display:flex;gap:16px;flex-wrap:wrap">${["Sci-Fi","Thriller","Animation","Drama","Action"].map(g=>
`<div style="padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px">
<span style="font-size:.85rem;color:var(--text-dim)">${g}</span>
</div>`).join("")}</div>
<div style="margin-top:16px;color:var(--text-muted);font-size:.82rem">Based on your favorites and viewing history.</div>
</div></div>`;
}
function render(){
let c=document.getElementById("appContent");
if(page==="home")c.innerHTML=home();
if(page==="movies")c.innerHTML=listing("movie");
if(page==="anime")c.innerHTML=listing("anime");
if(page==="favorites")c.innerHTML=favoritesPage();
if(page==="profile")c.innerHTML=profilePage();
document.getElementById("topbarTitle").textContent={home:"🏠 Home",movies:"🎬 Movies",anime:"⚡ Anime",favorites:"❤️ Favorites",profile:"👤 Profile"}[page];
document.getElementById("topAvatar").textContent=initials(profile.name);
let b=document.getElementById("favBadge");b.textContent=favorites.length;b.style.display=favorites.length?"inline-block":"none";
document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
bind();
if(page==="movies"||page==="anime") updateList();
}
function updateList(){
let type=page==="anime"?"anime":"movie", items=MOVIE_DB.filter(m=>m.type===type);
let genres=["All",...new Set(items.flatMap(m=>m.genre))];
document.getElementById("genreChips").innerHTML=genres.map(g=>`<button class="chip ${currentGenre===g?"active":""}" data-genre="${g}">${g}</button>`).join("");
let filtered=items.filter(m=>(currentGenre==="All"||m.genre.includes(currentGenre))&&(!currentSearch||m.title.toLowerCase().includes(currentSearch.toLowerCase())));
filtered.sort((a,b)=>currentSort==="rating"?b.rating-a.rating:b.year-a.year);
document.getElementById("countBadge").textContent=filtered.length+" titles";
document.getElementById("movieGrid").innerHTML=filtered.length?rows(filtered):`<div class="empty-state"><div class="icon">🔍</div><h3>Nothing found</h3><p>Try a different search term or genre.</p></div>`;
document.querySelectorAll("[data-genre]").forEach(x=>x.onclick=()=>{currentGenre=x.dataset.genre;updateList();});
}
function openModal(id){
let m=MOVIE_DB.find(x=>x.id===Number(id));if(!m)return;
document.getElementById("modalRoot").innerHTML=`<div class="modal-overlay" id="overlay">
  <div class="modal" onclick="event.stopPropagation()">
<div class="modal-close" id="closeModal">✕</div>
<div class="modal-poster"><img src="${m.poster}"
  alt="${m.title}"class ="modal-poster-image"/></div>
  <div class="modal-title">${m.title}</div>
<div class="modal-meta"><span class="movie-rating">★ ${m.rating}</span><span>·</span><span>${m.year}</span>
  <span>·</span><span>${m.type}</span></div>
<div class="tag-row" style="justify-content:center;margin-bottom:16px">${m.genre.map(g=>`<span class="genre-tag">${g}</span>`).join("")}</div>
<div class="modal-desc">${m.description}</div>
<div class="modal-actions"><button class="btn btn-sm btn-outline" id="modalFav">${fav(m)?"❤️ Saved":"🤍 Save"}</button></div>
<div class="divider" style="margin:24px 0 16px"></div>
<div style="font-size:.8rem;font-weight:600;color:var(--text-dim);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase">You might also like</div>
<div class="reco-scroll">${similar(m,6).map(x=>`<div class="reco-mini-card" data-open="${x.id}">
  <div class="reco-mini-poster"><img src="${x.poster}" alt="${x.title}"></div>
  <div class="reco-mini-title">${x.title}</div><div class="reco-mini-rating">★ ${x.rating}</div>
  </div>`).join("")}</div></div></div>`;
document.getElementById("overlay").onclick=()=>document.getElementById("modalRoot").innerHTML="";
document.getElementById("closeModal").onclick=()=>document.getElementById("modalRoot").innerHTML="";
document.getElementById("modalFav").onclick=()=>{toggleFav(m);openModal(m.id)};
document.querySelectorAll("#modalRoot [data-open]").forEach(x=>x.onclick=()=>openModal(x.dataset.open));
}
function homeSearch(){
let q=document.getElementById("heroSearch").value.trim().toLowerCase(),p=document.getElementById("searchPanel");if(!q){p.innerHTML="";return;}
let found=MOVIE_DB.filter(m=>m.title.toLowerCase().includes(q)||m.genre.some(g=>g.toLowerCase().includes(q)));
if(!found.length){p.innerHTML=`<div class="reco-panel"><div class="ai-response">No results found. Try a different title or genre.</div></div>`;return;}
let primary=found[0], rec=similar(primary,6);
p.innerHTML=`<div class="section"><div class="reco-panel">
  <div class="reco-panel-header"><span style="font-size:1.1rem;font-weight:600">Results for "${primary.title}"</span>
    <span class="reco-ai-badge">Recommended</span></div>
<div class="ai-response">Great choice! "${primary.title}" is a fantastic pick. Because it blends ${primary.genre.join(" and ")}, you may also enjoy these similar titles.</div>
<div style="font-size:.8rem;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px">Search Matches</div>
<div class="h-scroll">${rows(found)}</div>
<div style="font-size:.8rem;color:var(--text-muted);margin:24px 0 14px;text-transform:uppercase;letter-spacing:1px">Because you searched for ${primary.title}</div>
<div class="h-scroll">${rows(rec)}</div></div></div>`;
bind();
}
function scrollRow(button, direction) {
    const row = button.parentElement.querySelector(".h-scroll");

    row.scrollBy({
        left: direction * 600,
        behavior: "smooth"
    });
}
function bind(){
const menuBtn = document.getElementById("mobileMenuBtn");
const sidebar = document.querySelector(".sidebar");
const overlay = document.getElementById("sidebarOverlay");

if (menuBtn) {
  menuBtn.onclick = () => {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("active");
  };
}

if (overlay) {
  overlay.onclick = () => {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
  };
}

document.querySelectorAll(".nav-item").forEach(x => {
  x.onclick = () => {
    page = x.dataset.page;
    currentGenre = "All";
    currentSearch = "";

    sidebar.classList.remove("open");
    overlay.classList.remove("active");

    render();
  };
});
document.getElementById("topAvatar").onclick=()=>{page="profile";render();};
document.querySelectorAll("[data-fav]").forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(MOVIE_DB.find(m=>m.id==x.dataset.fav));});
document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openModal(x.dataset.open));
let hb=document.getElementById("heroBtn"),hs=document.getElementById("heroSearch");if(hb)hb.onclick=homeSearch;if(hs)hs.onkeydown=e=>{if(e.key==="Enter")homeSearch();};
let ps=document.getElementById("pageSearch");if(ps)ps.oninput=e=>{currentSearch=e.target.value;updateList();};
let ss=document.getElementById("sortSelect");if(ss)ss.onchange=e=>{currentSort=e.target.value;updateList();};
let save=document.getElementById("saveProfile");if(save)save.onclick=()=>{profile={name:document.getElementById("nameInput").value,email:document.getElementById("emailInput").value,phone:document.getElementById("phoneInput").value};localStorage.setItem("cinematchProfile",JSON.stringify(profile));render();alert("✅ Profile saved!");};
let discard=document.getElementById("discardProfile");if(discard)discard.onclick=()=>render();
}
render();
</script>
</body>
</html>
